name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/terraform-ci.yml
      - bootstrap/**
      - environments/**
      - modules/**
  push:
    branches: [main]
    paths:
      - .github/workflows/terraform-ci.yml
      - bootstrap/**
      - environments/**
      - modules/**
  workflow_dispatch:

concurrency:
  group: terraform-ci-dev
  cancel-in-progress: true

env:
  TF_VERSION: "1.10.5"
  TF_WORKING_DIR: environments/dev

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    needs: fmt
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize (local backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  plan-dev:
    name: terraform plan (dev)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verify repository variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_TERRAFORM_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
          TF_BACKEND_IMAGE_TAG: ${{ vars.TF_BACKEND_IMAGE_TAG }}
        run: |
          set -euo pipefail
          missing=()
          for name in AWS_REGION AWS_TERRAFORM_ROLE_ARN TF_STATE_BUCKET TF_STATE_KEY TF_STATE_REGION TF_BACKEND_IMAGE_TAG; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub repository variables: ${missing[*]}" >&2
            echo "Configure them under Settings → Secrets and variables → Actions → Variables." >&2
            echo "See docs/ci-cd.md for the full setup." >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Write backend configuration
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/backend.hcl" <<EOF
          bucket       = "${TF_STATE_BUCKET}"
          key          = "${TF_STATE_KEY}"
          region       = "${TF_STATE_REGION}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Initialize remote backend
        run: terraform init -backend-config="${RUNNER_TEMP}/backend.hcl" -input=false

      - name: Plan
        env:
          TF_BACKEND_IMAGE_TAG: ${{ vars.TF_BACKEND_IMAGE_TAG }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var="backend_image_tag=${TF_BACKEND_IMAGE_TAG}"
